<header>
  <a aria-label="Yelisson Ortiz home" data-i-aria-label="brandLabel" class="brand" href="#"
    ><span class="brand-name">Yelisson <span>Ortiz</span></span
    ><span class="brand-role" data-i="brandRole">Full-Stack Developer</span></a
  >
  <nav aria-label="Main navigation" data-i-aria-label="navLabel">
    <a data-i="navWork" href="#work">Selected work</a><a data-i="navExperience" href="#experience">Experience</a>
  </nav>
  <div class="header-actions">
    <button
      aria-label="Switch to light mode"
      data-i-aria-label="themeSwitchToLight"
      class="theme-toggle"
      id="theme-toggle"
      type="button"
    >
      <span aria-hidden="true" class="theme-icon">☀</span
      ><span class="theme-label" data-i="themeLight">Light</span></button
    ><button
      aria-label="Pause animations"
      data-i-aria-label="motionPause"
      aria-pressed="false"
      class="motion-toggle"
      type="button"
    >
      Ⅱ
    </button>
    <div aria-label="Language" data-i-aria-label="languageLabel" class="languages">
      <button aria-pressed="true" data-lang="en">EN</button><span>/</span
      ><button aria-pressed="false" data-lang="es">ES</button>
    </div>
    <a class="contact-nav" data-i="navContact" href="#contact">Let's talk</a>
  </div>
</header>
