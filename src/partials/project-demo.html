<dialog aria-labelledby="demo-title" id="silabin-demo">
  <div class="demo-shell">
    <div class="demo-toolbar">
      <div class="demo-heading">
        <h2 id="demo-title">Silabín</h2>
        <span data-i="demoLanguage">Interactive demo · Spanish</span>
      </div>
      <div class="demo-controls">
        <button aria-pressed="false" data-i="expandDemo" id="demo-expand" type="button">Expand</button
        ><button autofocus="" data-i="closeDemo" id="demo-close" type="button">Close</button>
      </div>
    </div>
    <div aria-busy="false" class="demo-stage">
      <div class="demo-loading" role="status">
        <span aria-hidden="true" class="demo-spinner"></span><span data-i="loadingDemo">Loading Silabín…</span>
      </div>
      <div id="demo-frame-host"></div>
    </div>
    <div class="demo-footer">
      <span data-i="demoFallback">If the demo doesn't appear, open it in a new tab.</span
      ><a
        data-i="openExternal"
        href="https://silabin-ljtp8ckdq-yelison1s-projects.vercel.app/"
        rel="noopener noreferrer"
        target="_blank"
        >Open Silabín</a
      >
    </div>
  </div>
</dialog>
